<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 종이 톤 배경 -->
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0 0.08  0 0 0 0.08 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="coffee" cx="85%" cy="20%" r="12%">
      <stop offset="0%" stop-color="rgb(168,120,60)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="rgb(168,120,60)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper bg -->
  <rect width="1200" height="630" fill="#FAF6EC"/>

  <!-- coffee ring stain -->
  <rect width="1200" height="630" fill="url(#coffee)"/>

  <!-- paper fibers (horizontal lines) -->
  <g opacity="0.08" stroke="#3A352C" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="58"/>
    <line x1="0" y1="120" x2="1200" y2="122"/>
    <line x1="0" y1="180" x2="1200" y2="178"/>
    <line x1="0" y1="240" x2="1200" y2="242"/>
    <line x1="0" y1="300" x2="1200" y2="298"/>
    <line x1="0" y1="360" x2="1200" y2="362"/>
    <line x1="0" y1="420" x2="1200" y2="418"/>
    <line x1="0" y1="480" x2="1200" y2="482"/>
    <line x1="0" y1="540" x2="1200" y2="538"/>
  </g>

  <!-- left margin hole punches -->
  <g>
    <circle cx="40" cy="120" r="12" fill="#C0B89E" stroke="#A8A087" stroke-width="1"/>
    <circle cx="40" cy="250" r="12" fill="#C0B89E" stroke="#A8A087" stroke-width="1"/>
    <circle cx="40" cy="380" r="12" fill="#C0B89E" stroke="#A8A087" stroke-width="1"/>
    <circle cx="40" cy="510" r="12" fill="#C0B89E" stroke="#A8A087" stroke-width="1"/>
  </g>

  <!-- 후추통 (좌측 상단·크기 조정·텍스트 영역 겹침 회피) -->
  <g transform="translate(130, 40) rotate(-6) scale(1.7)">
    <!-- cap -->
    <path d="M14,8 Q15,5 18,4 L52,4 Q56,5 57,8 L58,22 Q57,24 54,24 L16,24 Q13,24 12,22 Z"
          fill="#3A352C" stroke="#3A352C" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- cap dots -->
    <circle cx="22" cy="13" r="1.3" fill="#FAF6EC"/>
    <circle cx="30" cy="11" r="1.3" fill="#FAF6EC"/>
    <circle cx="38" cy="13" r="1.3" fill="#FAF6EC"/>
    <circle cx="46" cy="11" r="1.3" fill="#FAF6EC"/>
    <circle cx="26" cy="17" r="1.3" fill="#FAF6EC"/>
    <circle cx="34" cy="18" r="1.3" fill="#FAF6EC"/>
    <circle cx="42" cy="17" r="1.3" fill="#FAF6EC"/>
    <!-- body -->
    <path d="M10,26 Q10,24 13,24 L57,24 Q60,24 60,27 L60,80 Q60,84 56,85 L14,85 Q10,84 10,80 Z"
          fill="none" stroke="#3A352C" stroke-width="2" stroke-linejoin="round"/>
    <!-- label oval -->
    <ellipse cx="35" cy="55" rx="18" ry="15" fill="none" stroke="#C8412C" stroke-width="1.6" stroke-dasharray="2 2"/>
    <text x="35" y="54" text-anchor="middle" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="11" fill="#C8412C" font-weight="700">PEPPER</text>
    <text x="35" y="66" text-anchor="middle" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="8" fill="#C8412C">후추</text>
    <!-- pepper grains falling -->
    <circle cx="30" cy="-4" r="1.4" fill="#2A2823"/>
    <circle cx="38" cy="-8" r="1.2" fill="#2A2823"/>
    <circle cx="33" cy="-13" r="1" fill="#2A2823"/>
    <circle cx="42" cy="-14" r="1.1" fill="#2A2823"/>
    <circle cx="28" cy="-17" r="0.9" fill="#2A2823"/>
  </g>

  <!-- main title "peppinch" — 글자별 font-weight gradient (왼쪽 가늘게 → 오른쪽 굵게) -->
  <g transform="rotate(-1.4 100 370)" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="200" fill="#2A2823" letter-spacing="-6">
    <text x="100"  y="370" font-weight="200">p</text>
    <text x="217"  y="370" font-weight="300">e</text>
    <text x="328"  y="370" font-weight="400">p</text>
    <text x="445"  y="370" font-weight="500">p</text>
    <text x="566"  y="370" font-weight="600">i</text>
    <text x="630"  y="370" font-weight="700">n</text>
    <text x="755"  y="370" font-weight="800">c</text>
    <text x="868"  y="370" font-weight="900">h</text>
  </g>

  <!-- 빨간 dot — peppinch 마지막 "h" 옆·underline 끝점 영역 (살짝 위) -->
  <circle cx="1000" cy="365" r="18" fill="#C8412C" transform="rotate(-1.4 100 370)"/>

  <!-- underline — dot 영역 옆에서 자연스럽게 끝남 -->
  <path d="M105,395 Q300,375 600,388 T985,378" fill="none" stroke="#C8412C" stroke-width="6" stroke-linecap="round" transform="rotate(-1.4 100 370)"/>

  <!-- tagline 영문 -->
  <text x="100" y="445" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="32" font-style="italic"
        fill="#3A352C" opacity="0.85">A Pinch Of Pepper.</text>

  <!-- tagline 한글 -->
  <text x="100" y="495" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="38" font-weight="400"
        fill="#3A352C" opacity="0.75">한 꼬집의 후추.</text>

  <!-- sub line — 후추님 톤 -->
  <text x="100" y="555" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="22" fill="#3A352C" opacity="0.65">
    이런 거 왜 없지 싶은 걸, 한 꼬집씩 만듭니다. 혼자, AI랑 같이.
  </text>

  <!-- meta 우상단 stamp -->
  <g transform="translate(990, 90) rotate(6)">
    <rect x="0" y="0" width="160" height="50" fill="none" stroke="#C8412C" stroke-width="2.5" opacity="0.85"/>
    <text x="80" y="22" text-anchor="middle" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="14" font-weight="700"
          fill="#C8412C" letter-spacing="2">PEPPINCH</text>
    <text x="80" y="40" text-anchor="middle" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="10"
          fill="#C8412C" opacity="0.85" letter-spacing="1.5">SOLO LAB · SEOUL</text>
  </g>

  <!-- footer scribble — peppinch.com -->
  <text x="100" y="605" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="18" font-weight="600"
        fill="#C8412C">peppinch.com</text>
  <text x="280" y="605" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans CJK KR, Helvetica, Arial, sans-serif" font-size="16"
        fill="#3A352C" opacity="0.55">· pepper@peppinch.com · @peppinch_</text>

  <!-- salt pinch 우하단 — 점 영역 굵게·더 visible -->
  <g transform="translate(1100, 575)">
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="none" stroke="#3A352C" stroke-width="2.5"/>
    <circle cx="-10" cy="-15" r="3" fill="#2A2823"/>
    <circle cx="4" cy="-19" r="2.8" fill="#2A2823"/>
    <circle cx="-2" cy="-26" r="2.5" fill="#2A2823"/>
    <circle cx="12" cy="-30" r="2.7" fill="#2A2823"/>
    <circle cx="-14" cy="-32" r="2.3" fill="#2A2823"/>
    <circle cx="6" cy="-38" r="2.1" fill="#2A2823"/>
    <circle cx="-6" cy="-42" r="1.9" fill="#2A2823"/>
  </g>
</svg>
