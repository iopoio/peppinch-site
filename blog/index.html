<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>peppinch — blog</title>
<meta name="description" content="펩핀치 블로그 — 1인 인디해커 빌드·실험 누적. 작업 흐름·결과·실패·다음 시도 기록." />
<meta property="og:title" content="peppinch — blog" />
<meta property="og:description" content="1인 인디해커 빌드·실험 누적. 작업 흐름·결과·실패·다음 시도 기록." />
<meta property="og:image" content="https://peppinch.com/og-image.png" />
<meta property="og:url" content="https://peppinch.com/blog/" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧂</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />

<style>
  @font-face {
    font-family: "Kyobo";
    src: url("/fonts/KyoboHandwriting2019.otf") format("opentype");
    font-display: swap;
  }
  :root {
    --paper: #faf6ec;
    --ink: #2a2823;
    --pencil: #3a352c;
    --red: #c8412c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Kyobo", "Kalam", sans-serif;
    font-weight: 300;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(91deg, transparent 0 38px, rgba(0,0,0,.012) 38px 39px),
      repeating-linear-gradient(2deg, transparent 0 46px, rgba(0,0,0,.012) 46px 47px);
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  .page {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: 80px 32px 120px;
    z-index: 3;
  }

  .nav {
    display: flex; gap: 22px; flex-wrap: wrap;
    margin-bottom: 60px;
  }
  .nav a {
    font-family: "Kyobo", "Caveat", cursive;
    font-weight: 500;
    font-size: 22px;
    color: var(--pencil);
    text-decoration: none;
    line-height: 1;
    padding: 6px 14px 4px;
    border: 1.5px dashed transparent;
    transition: color .25s, border-color .25s;
  }
  .nav a:hover { color: var(--red); border-color: var(--red); }
  .nav a[data-active] { color: var(--red); border-color: var(--red); border-style: solid; border-width: 2px; }

  h1 {
    font-family: "Kyobo", "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(48px, 8vw, 88px);
    line-height: .95;
    margin: 0 0 16px;
    transform: rotate(-.8deg);
    color: var(--ink);
  }
  .sub {
    font-family: "Kyobo", "Kalam", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--pencil);
    opacity: .85;
    max-width: 520px;
    margin-bottom: 60px;
  }
  .sub em { color: var(--red); font-style: normal; font-weight: 500; }

  .stack {
    display: flex; flex-direction: column;
    gap: 0;
    border-top: 2px dashed rgba(58,53,44,.2);
  }
  .post {
    display: flex; flex-direction: column;
    padding: 28px 0;
    border-bottom: 2px dashed rgba(58,53,44,.2);
  }
  .post .date {
    font-family: "Kyobo", "Kalam", sans-serif;
    font-size: 12px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .post .title {
    font-family: "Kyobo", "Caveat", cursive;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.1;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .post .summary {
    font-family: "Kyobo", "Kalam", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--pencil);
    margin: 0;
  }
  .empty {
    font-family: "Kyobo", "Kalam", sans-serif;
    font-size: 16px;
    color: var(--pencil);
    opacity: .65;
    text-align: center;
    padding: 60px 0;
    font-style: italic;
  }

  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 2px dashed rgba(58,53,44,.2);
    display: flex; justify-content: space-between;
    font-family: "Kyobo", "Caveat", cursive;
    font-size: 18px;
    color: var(--pencil);
    flex-wrap: wrap; gap: 16px;
  }
  footer b { color: var(--red); }
</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/">home</a>
      <a href="/business/">business</a>
      <a href="/blog/" data-active>blog</a>
      <a href="mailto:pepper@peppinch.com">contact</a>
    </nav>

    <h1>blog · 흩어진 메모</h1>
    <p class="sub">
      만들면서 부딪힌 것들을 가끔 적는다.
      <em>천천히, 한 꼬집씩.</em>
    </p>

    <div class="stack">
      <!-- 새 글 추가: 아래 .empty div 위에 .post snippet 삽입 (posts/GUIDE.md 참조)
      <article class="post">
        <span class="date">YYYY · MM · DD</span>
        <h2 class="title">제목 한 줄</h2>
        <p class="summary">2~3줄 요약. 흩어진 메모니까 길게 X.</p>
      </article>
      -->
      <div class="empty">— 첫 글 준비 중 (TickDeck 6주 검증 누적용) —</div>
    </div>

    <footer>
      <span>made slow, in seoul — <b>peppinch</b> 🧂</span>
      <span>pepper@peppinch.com · @peppinch_</span>
    </footer>
  </div>
</body>
</html>
