<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>p03 — 목차</title>
<style>
  :root{
    --orange:#E8590C; --orange-deep:#9E3A05;
    --ink:#201C16; --sub:#6B665E; --bg:#F1F3F6; --line:#E4E7EC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DDE1E7;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink)}
  .motif{position:absolute;inset:0;pointer-events:none}
  .head{position:absolute;top:44px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:flex-start}
  .kicker{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;letter-spacing:0.13em;
          color:var(--orange);text-transform:uppercase;margin-bottom:14px}
  .kicker::before{content:"";display:inline-block;width:22px;height:2px;background:var(--orange)}
  h1{font-size:34px;font-weight:850;letter-spacing:-0.025em}
  .pageno{font-size:14px;color:#9A958C;font-weight:700;letter-spacing:0.06em;padding-top:6px}
  .list{position:absolute;left:64px;right:64px;top:196px}
  .row{display:flex;align-items:baseline;gap:36px;padding:30px 8px 29px;border-top:1px solid var(--line)}
  .row:last-child{border-bottom:1px solid var(--line)}
  .tag{flex:none;width:104px;font-size:13px;font-weight:800;letter-spacing:0.1em;color:var(--orange-deep)}
  .row .txt{flex:1}
  .row .txt .t{font-size:25px;font-weight:800;letter-spacing:-0.02em;line-height:1.3}
  .row .txt .d{font-size:14px;color:var(--sub);margin-top:6px}
  .row .no{flex:none;font-size:15px;font-weight:800;color:#C5CAD2;letter-spacing:0.04em}
  .foot{position:absolute;left:64px;right:64px;bottom:32px;display:flex;justify-content:space-between;font-size:12px;color:#9A958C}
</style>
</head>
<body>
<div class="stage">
  <svg class="motif" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
    <path d="M 1340 90 C 1120 140, 1010 60, 820 110"
          stroke="#E8590C" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M1226 660 l6 7 12-14" stroke="#E8590C" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="head">
    <div>
      <div class="kicker">Contents</div>
      <h1>목차</h1>
    </div>
    <div class="pageno">03 / 16</div>
  </div>

  <div class="list">
    <div class="row">
      <div class="tag">도입</div>
      <div class="txt">
        <div class="t">제자리인 광고 시장</div>
        <div class="d">돈은 그 안에서만 움직인다</div>
      </div>
      <div class="no">01</div>
    </div>
    <div class="row">
      <div class="tag">PART Ⅰ</div>
      <div class="txt">
        <div class="t">예산을 흔드는 네 가지 변화</div>
        <div class="d">검색·AI 제작·에이전틱 AI·마케팅 예산</div>
      </div>
      <div class="no">02</div>
    </div>
    <div class="row">
      <div class="tag">PART Ⅱ</div>
      <div class="txt">
        <div class="t">아직 판단하기 이른 다섯 가지와 지켜볼 포인트</div>
      </div>
      <div class="no">03</div>
    </div>
    <div class="row">
      <div class="tag">PART Ⅲ</div>
      <div class="txt">
        <div class="t">결론과 제언</div>
        <div class="d">그래서 뭘 해야 하나</div>
      </div>
      <div class="no">04</div>
    </div>
  </div>

  <div class="foot">
    <div>2026 마케팅 트렌드 브리핑</div>
    <div>© 2026 Peppinch · All rights reserved</div>
  </div>
</div>
</body>
</html>
