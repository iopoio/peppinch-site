<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>p12 — PART Ⅲ 간지</title>
<style>
  :root{ --orange:#E8590C; --orange-deep:#9E3A05; --ink:#201C16; --sub:#6B665E; --bg:#F1F3F6; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DDE1E7;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink)}
  .motif{position:absolute;inset:0;pointer-events:none}
  .pageno{position:absolute;top:52px;right:64px;font-size:14px;color:#9A958C;font-weight:700;letter-spacing:0.06em}
  .block{position:absolute;left:64px;top:218px;max-width:700px}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;font-weight:800;
          letter-spacing:0.15em;color:var(--orange);text-transform:uppercase;margin-bottom:22px}
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--orange)}
  h1{font-size:52px;line-height:1.18;font-weight:850;letter-spacing:-0.03em;color:var(--ink)}
  h1 .hl{color:var(--orange)}
  .rows{margin-top:40px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:baseline;gap:16px}
  .row .tag{flex:none;font-size:13px;font-weight:800;letter-spacing:0.08em;color:var(--orange-deep);
            background:#FFEDE0;border-radius:999px;padding:6px 15px}
  .row .txt{font-size:18.5px;font-weight:600;color:#3E3A33;letter-spacing:-0.01em}
  .row .txt b{color:var(--ink);font-weight:800}
  .foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:flex-end;
        font-size:12px;color:#9A958C}
</style>
</head>
<body>
<div class="stage">
  <svg class="motif" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
    <path d="M 700 128 C 850 170, 940 280, 1042 348"
          stroke="#E8590C" stroke-opacity="0.30" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M 664 292 C 810 310, 930 330, 1042 356"
          stroke="#E8590C" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M 664 432 C 810 414, 930 392, 1042 366"
          stroke="#E8590C" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M 700 590 C 850 552, 940 440, 1042 374"
          stroke="#E8590C" stroke-opacity="0.30" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <circle cx="1064" cy="360" r="17" fill="#E8590C" fill-opacity="0.92"/>
    <path d="M1056 360 l5.5 6 11-13" stroke="#FFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1064" cy="360" r="27" stroke="#E8590C" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6"/>
  </svg>
  <div class="pageno">12 / 16</div>
  <div class="block">
    <div class="kicker">Part Ⅲ</div>
    <h1>네 가지 변화가 가리키는<br><span class="hl">같은 결론</span></h1>
    <div class="rows">
      <div class="row">
        <span class="tag">결론</span>
        <span class="txt"><b>성과를 숫자로 보여준 소수</b>가 예산을 가져간다</span>
      </div>
      <div class="row">
        <span class="tag">제언</span>
        <span class="txt">그래서 뭘 해야 하나, <b>다섯 가지</b></span>
      </div>
    </div>
  </div>
  <div class="foot">© 2026 Peppinch · All rights reserved</div>
</div>

</html>
