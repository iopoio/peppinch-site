<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>p10 — PART Ⅱ 간지</title>
<style>
  :root{ --orange:#E8590C; --tint:#FFD9BF; --dim:#8D8779; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DDE1E7;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;
         background:radial-gradient(1100px 700px at 78% 18%, #221B12 0%, #17130E 55%, #120F0B 100%);
         color:#F5F1EA;}
  .motif{position:absolute;inset:0;pointer-events:none}
  .pageno{position:absolute;top:52px;right:64px;font-size:14px;color:var(--dim);font-weight:700;letter-spacing:0.06em}
  .block{position:absolute;left:64px;top:236px;max-width:820px}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;font-weight:800;
          letter-spacing:0.15em;color:var(--tint);text-transform:uppercase;margin-bottom:24px}
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--orange)}
  h1{font-size:62px;line-height:1.14;font-weight:850;letter-spacing:-0.03em;color:#FBF8F3}
  h1 .hl{color:#FF9E66}
  .summary{margin-top:22px;font-size:19px;font-weight:500;color:#CFC8BD;letter-spacing:-0.005em;line-height:1.55}
  .pending{margin-top:38px}
  .foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:flex-end;
        font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="stage">
  <svg class="motif" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
    <path d="M 940 -30 C 1030 130, 890 260, 1070 350 S 1290 500, 1200 660"
          stroke="#E8590C" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M -50 560 C 130 520, 230 620, 410 585"
          stroke="#E8590C" stroke-opacity="0.13" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M1058 338 l6.5 7.5 13-15" stroke="#FF9E66" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="pageno">10 / 16</div>
  <div class="block">
    <div class="kicker">Part Ⅱ</div>
    <h1>아직 판단하기 이른<br><span class="hl">다섯 가지</span></h1>

      <circle cx="14"  cy="12" r="7" stroke="#E8590C" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
      <circle cx="82"  cy="12" r="7" stroke="#E8590C" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
      <circle cx="150" cy="12" r="7" stroke="#E8590C" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
      <circle cx="218" cy="12" r="7" stroke="#E8590C" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
      <circle cx="286" cy="12" r="7" stroke="#E8590C" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>
    </svg>
  </div>
  <div class="foot">© 2026 Peppinch · All rights reserved</div>
</div>
</body>
</html>
