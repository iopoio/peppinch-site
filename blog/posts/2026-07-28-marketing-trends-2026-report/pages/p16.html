<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>p16 — 감사합니다</title>
<style>
  :root{ --orange:#E8590C; --tint:#FFD9BF; --dim:#B8B2A8; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DDE1E7;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;
         background:radial-gradient(1100px 700px at 78% 18%, #221B12 0%, #17130E 55%, #120F0B 100%);
         color:#F5F1EA;}
  .motif{position:absolute;inset:0;pointer-events:none}
  .top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline}
  .wordmark{font-weight:800;font-size:19px;letter-spacing:-0.01em;color:#F5F1EA}
  .wordmark b{color:var(--orange)}
  .pageno{font-size:14px;color:#8D8779;font-weight:700;letter-spacing:0.06em}
  .hero{position:absolute;left:64px;bottom:170px;max-width:1152px}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
          letter-spacing:0.14em;color:var(--tint);text-transform:uppercase;margin-bottom:26px}
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--orange)}
  h1{font-size:104px;line-height:1.02;font-weight:850;letter-spacing:-0.035em;color:#FBF8F3}
  h1 .dot{color:var(--orange)}
  .contact{margin-top:34px;display:flex;align-items:center;gap:18px;font-size:17px;color:var(--dim);font-weight:500}
  .contact b{color:#FBF8F3;font-weight:800;letter-spacing:0.02em}
  .contact .sep{width:1px;height:16px;background:rgba(255,255,255,0.22)}
  .contact .mail{color:var(--tint);font-weight:600}
  .meta{position:absolute;left:64px;bottom:64px;font-size:13.5px;color:#8D8779;font-weight:500;letter-spacing:0.01em}
  .meta em{font-style:normal;color:#B8B2A8}
</style>
</head>
<body>
<div class="stage">
  <svg class="motif" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
    <path d="M 360 -40 C 270 120, 400 240, 220 330 S -20 470, 70 640"
          stroke="#E8590C" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M226 318 l7 8 14-16" stroke="#FF9E66" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 616 l5.5 6.5 11-13" stroke="#E8590C" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="top">
    <div class="wordmark">Peppinch<b>.</b>com</div>
    <div class="pageno">16 / 16</div>
  </div>
  <div class="hero">
    <div class="kicker">Marketing Trends 2026</div>
    <h1>감사합니다<span class="dot">.</span></h1>
    <div class="contact">
      <b>PEPPINCH</b>
      <span class="sep"></span>
      <span>채영화</span>
      <span class="sep"></span>
      <span class="mail">pepper@peppinch.com</span>
    </div>
  </div>
  <div class="meta"><em>Marketing Trends 2026</em> · © 2026 Peppinch · All rights reserved</div>
</div>
</body>
</html>
