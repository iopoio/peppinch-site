<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>p01 — 표지</title>
<style>
  :root{ --orange:#E8590C; --tint:#FFD9BF; --dim:#B8B2A8; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DDE1E7;display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;
         background:radial-gradient(1100px 700px at 78% 18%, #221B12 0%, #17130E 55%, #120F0B 100%);
         color:#F5F1EA;}
  .motif{position:absolute;inset:0;pointer-events:none}
  .top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline}
  .wordmark{font-weight:800;font-size:19px;letter-spacing:-0.01em;color:#F5F1EA}
  .wordmark b{color:var(--orange)}
  .top .right{font-size:15px;color:var(--dim);font-weight:600;letter-spacing:0.02em}
  .hero{position:absolute;left:64px;bottom:158px;max-width:1152px}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
          letter-spacing:0.14em;color:var(--tint);text-transform:uppercase;margin-bottom:28px}
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--orange)}
  h1{font-size:73px;line-height:1.12;font-weight:850;letter-spacing:-0.03em;color:#FBF8F3}
  h1 .hl{color:#FF9E66}
  .claim{margin-top:28px;font-size:22.5px;font-weight:500;color:#CFC8BD;letter-spacing:-0.01em;line-height:1.5}
  .claim b{color:#FBF8F3;font-weight:700}
  .badge{position:absolute;right:64px;bottom:64px;display:flex;align-items:center;gap:11px;
         border:1px solid rgba(232,89,12,0.55);background:rgba(232,89,12,0.10);
         border-radius:999px;padding:12px 22px 12px 16px}
  .badge .tick{width:22px;height:22px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;flex:none}
  .badge span{font-size:14.5px;font-weight:700;color:#FFE1CE;letter-spacing:0.01em}
  .meta{position:absolute;left:64px;bottom:64px;font-size:13.5px;color:#8D8779;font-weight:500;letter-spacing:0.01em}
  .meta em{font-style:normal;color:#B8B2A8}
</style>
</head>
<body>
<div class="stage">
  <svg class="motif" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
    <path d="M 980 -60 C 1080 100, 900 230, 1090 340 S 1300 500, 1180 660"
          stroke="#E8590C" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M -60 150 C 120 110, 230 210, 400 170"
          stroke="#E8590C" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <path d="M1076 328 l7 8 14-16" stroke="#FF9E66" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M962 62 l5.5 6.5 11-13" stroke="#E8590C" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1168 618 l5.5 6.5 11-13" stroke="#E8590C" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="top">
    <div class="wordmark">Peppinch<b>.</b>com</div>
    <div class="right">2026 마케팅 트렌드 브리핑 · 01 / 16</div>
  </div>
  <div class="hero">
    <div class="kicker">Marketing Trends 2026</div>
    <h1>AI는 이제 다들 쓴다 —<br>예산은 <span class="hl">성과</span>를 보여준 쪽으로 간다</h1>
    <div class="claim">광고비가 제자리인 한국 시장 — 검색·AI 제작·에이전틱 AI·마케팅 예산, <b>네 가지 변화</b>로 읽는 2026년 마케팅</div>
  </div>
  <div class="meta"><em>국내 광고비 기준 — KOBACO 방송통신광고비 조사(국가승인통계)</em> · © 2026 Peppinch</div>
  <div class="badge">
    <div class="tick"><svg width="12" height="10" viewBox="0 0 12 10"><path d="M1.5 5.2 4.6 8.3 10.5 1.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span>수치 전수 출처 원문 대조 · 검증 리포트 동봉</span>
  </div>
</div>
</body>
</html>
