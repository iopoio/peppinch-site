<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>peppinch — blog</title>
<meta name="description" content="펩핀치 블로그 글." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧂</text></svg>" />
<meta property="og:type" content="article" />
<meta property="og:image" content="https://www.peppinch.com/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZ7ZXMFEBM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date()); gtag('config', 'G-LZ7ZXMFEBM');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
  @font-face {
    font-family:"Kyobo";
    src:url("/fonts/KyoboHandwriting2019.woff2") format("woff2"),
        url("/fonts/KyoboHandwriting2019.otf") format("opentype");
    font-display:swap;
  }
  :root { --paper:#faf6ec; --ink:#23211c; --pencil:#5a554b; --red:#c8412c; --blue:#2f5fa8; --line:#d9d2c2; --card:#fffdf7; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; max-width:100%; overflow-x:clip; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .page { max-width:720px; margin:0 auto; padding:48px 24px 100px; }

  /* 브랜드 크롬(손글씨) */
  .nav { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:40px; }
  .nav a { font-family:"Kyobo","Caveat",cursive; font-weight:500; font-size:21px; color:var(--pencil); text-decoration:none; line-height:1; }
  .nav a:hover { color:var(--red); }
  .nav a[data-active] { color:var(--red); }

  /* 글머리 */
  .meta-date { font-size:12.5px; letter-spacing:.12em; color:var(--red); font-weight:700; }
  #content h1 { font-size:clamp(26px,4.5vw,34px); line-height:1.3; font-weight:800; letter-spacing:-.01em; margin:8px 0 10px; color:var(--ink); }
  .source { font-size:14px; color:var(--pencil); margin:0 0 4px; }
  .source a { color:var(--blue); }

  #content { font-size:16.5px; }
  #content > p { margin:14px 0; color:#322f29; }
  #content a { color:var(--blue); }
  #content h2 { font-size:21px; font-weight:800; margin:36px 0 12px; }
  hr { border:0; border-top:1px solid var(--line); margin:32px 0; }

  /* ── 회의록 브리핑 박스 (사실·출처 layer) ── */
  .brief {
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; margin:26px 0;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .brief-head { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .brief-tag {
    display:inline-block; background:var(--red); color:#fff; font-size:12px; font-weight:700;
    padding:3px 9px; border-radius:999px; margin-right:8px; letter-spacing:.02em;
  }
  .brief-note { font-size:13px; color:var(--pencil); margin:0 0 18px; }
  .brief-note a { color:var(--blue); }
  .topic { padding:14px 0; border-top:1px solid var(--line); }
  .topic:first-of-type { border-top:0; padding-top:4px; }
  .topic h3 { font-size:16.5px; font-weight:800; margin:0 0 8px; color:var(--ink); }
  .topic ul { margin:0; padding-left:0; list-style:none; }
  .topic li { font-size:15px; line-height:1.6; color:#3a372f; margin:7px 0; padding-left:14px; position:relative; }
  .topic li::before { content:"·"; position:absolute; left:2px; color:var(--red); font-weight:700; }
  .who { color:var(--blue); font-weight:700; margin-right:4px; }

  /* ── 내 생각 박스 (의견 layer) ── */
  .opinion {
    border-left:4px solid var(--red); background:rgba(200,65,44,.04);
    border-radius:0 10px 10px 0; padding:18px 22px; margin:30px 0 10px;
  }
  .opinion-label { font-size:15px; font-weight:800; color:var(--red); margin-bottom:8px; }
  .opinion p { margin:12px 0; font-size:16.5px; color:#322f29; }
  .opinion .ask { font-weight:700; color:var(--ink); margin-top:16px; }

  /* 표: 안 깨짐 (모바일 가로 스크롤) */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0; }
  #content table { border-collapse:collapse; font-size:14.5px; width:100%; min-width:min(100%,520px); }
  #content th, #content td { text-align:left; padding:9px 12px; border:1px solid var(--line); vertical-align:top; }
  #content th { background:#f3eee2; font-weight:700; white-space:nowrap; }
  .mermaid { margin:22px 0; text-align:center; overflow-x:auto; }

  .back { display:inline-block; margin-top:36px; font-family:"Kyobo","Caveat",cursive; font-size:20px; color:var(--blue); text-decoration:none; }
  .back:hover { color:var(--red); }
  footer {
    margin-top:48px; padding-top:22px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px;
    font-family:"Kyobo","Caveat",cursive; font-size:18px; color:var(--pencil);
  }
  footer b { color:var(--red); }
  .loading { color:var(--pencil); opacity:.6; padding:40px 0; }
</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/">home</a>
      <a href="/business/">business</a>
      <a href="/blog/" data-active>blog</a>
      <a href="mailto:pepper@peppinch.com">contact</a>
    </nav>

    <span class="meta-date" id="meta-date"></span>
    <p class="source" id="meta-source"></p>
    <article id="content"><p class="loading">불러오는 중…</p></article>

    <a class="back" href="/blog/">← 다른 메모 보기</a>
    <footer>
      <span>made slow, in seoul — <b>peppinch</b> 🧂</span>
      <span>pepper@peppinch.com · @peppinch_</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('p');
      var content = document.getElementById('content');
      if (!slug || !/^[\w-]+$/.test(slug)) { content.innerHTML = '<p>글을 찾을 수 없어요.</p>'; return; }

      fetch('posts/' + slug + '.md')
        .then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (raw) {
          var meta = {}, body = raw;
          var fm = raw.match(/^---\n([\s\S]*?)\n---\n?/);
          if (fm) {
            fm[1].split('\n').forEach(function (line) {
              var i = line.indexOf(':');
              if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
            });
            body = raw.slice(fm[0].length);
          }
          if (meta.title) document.title = meta.title + ' · peppinch blog';
          if (meta.date) document.getElementById('meta-date').textContent = meta.date.replace(/-/g, ' · ');
          if (meta.source) {
            var s = '출처: ' + meta.source;
            if (meta.source_url) s += ' · <a href="' + meta.source_url + '">원본</a>';
            document.getElementById('meta-source').innerHTML = s;
          }

          content.innerHTML = marked.parse(body, { gfm: true, breaks: false });

          content.querySelectorAll('code.language-mermaid').forEach(function (code) {
            var div = document.createElement('div'); div.className = 'mermaid';
            div.textContent = code.textContent;
            (code.closest('pre') || code).replaceWith(div);
          });
          content.querySelectorAll('table').forEach(function (t) {
            var w = document.createElement('div'); w.className = 'table-wrap';
            t.replaceWith(w); w.appendChild(t);
          });
          if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
            try { mermaid.run({ nodes: content.querySelectorAll('.mermaid') }); } catch (e) {}
          }
        })
        .catch(function () { content.innerHTML = '<p>글을 불러오지 못했어요. 주소를 확인해 주세요.</p>'; });
    })();
  </script>
</body>
</html>
