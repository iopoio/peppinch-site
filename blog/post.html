<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>peppinch — blog</title>
<meta name="description" content="펩핀치 블로그 글." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧂</text></svg>" />
<meta property="og:type" content="article" />
<meta property="og:image" content="https://www.peppinch.com/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZ7ZXMFEBM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date()); gtag('config', 'G-LZ7ZXMFEBM');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
  @font-face { font-family:"Kyobo"; src:url("/fonts/KyoboHandwriting2019.woff2") format("woff2"),url("/fonts/KyoboHandwriting2019.otf") format("opentype"); font-display:swap; }
  :root { --paper:#faf6ec; --ink:#23211c; --pencil:#5a554b; --red:#c8412c; --blue:#2f5fa8; --line:#ded7c7; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; max-width:100%; overflow-x:clip; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .page { max-width:740px; margin:0 auto; padding:40px 22px 90px; }

  .nav { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
  .nav a { font-family:"Kyobo","Caveat",cursive; font-weight:500; font-size:21px; color:var(--pencil); text-decoration:none; line-height:1; }
  .nav a:hover { color:var(--red); }
  .nav a[data-active] { color:var(--red); }

  /* 흰 문서 카드 */
  .doc {
    background:#fffdf9; border:1px solid var(--line); border-radius:16px;
    padding:42px 40px; box-shadow:0 1px 4px rgba(60,50,30,.05);
  }

  .meta-date { font-size:12.5px; letter-spacing:.12em; color:var(--red); font-weight:700; }
  #content h1 { font-size:clamp(25px,4.4vw,33px); line-height:1.32; font-weight:800; letter-spacing:-.01em; margin:8px 0 8px; color:var(--ink); }
  .source { font-size:14px; color:var(--pencil); margin:0 0 6px; }
  .source a { color:var(--blue); }

  #content { font-size:16.5px; }
  #content > p { margin:14px 0; color:#322f29; }
  #content a { color:var(--blue); }
  hr { border:0; border-top:1px solid var(--line); margin:30px 0; }

  /* ── 회의록 브리핑 박스 ── */
  .brief { background:#faf6ec; border:1px solid var(--line); border-radius:12px; padding:8px 22px 18px; margin:24px 0; }
  .brief-head { font-size:15px; font-weight:700; color:var(--ink); margin:18px 0 4px; }
  .brief-tag { display:inline-block; background:var(--red); color:#fff; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; margin-right:8px; }
  .brief-note { font-size:12.5px; color:var(--pencil); margin:0 0 6px; }
  .brief-note a { color:var(--blue); }
  .bs { padding:16px 0; border-top:1px solid var(--line); }
  .bs-t { font-size:13.5px; font-weight:800; color:var(--red); letter-spacing:.04em; margin:0 0 10px; text-transform:uppercase; }
  .bs > p { margin:0 0 10px; font-size:15.5px; color:#322f29; }
  .bs > ul { margin:0; padding-left:18px; }
  .bs > ul > li { font-size:15px; line-height:1.6; margin:6px 0; color:#3a372f; }
  .topic { margin:14px 0; }
  .topic h4 { font-size:15.5px; font-weight:800; margin:0 0 7px; color:var(--ink); }
  .topic ul { margin:0; padding-left:0; list-style:none; }
  .topic li { font-size:14.5px; line-height:1.6; color:#3a372f; margin:6px 0; padding-left:14px; position:relative; }
  .topic li::before { content:"·"; position:absolute; left:3px; color:var(--red); font-weight:700; }
  .who { color:var(--blue); font-weight:700; margin-right:3px; }

  /* ── 내 생각 박스 ── */
  .opinion { border-left:4px solid var(--red); background:rgba(200,65,44,.045); border-radius:0 10px 10px 0; padding:16px 22px; margin:28px 0 4px; }
  .opinion-label { font-size:14.5px; font-weight:800; color:var(--red); margin-bottom:6px; }
  .opinion p { margin:11px 0; font-size:16px; color:#322f29; }
  .opinion .ask { font-weight:700; color:var(--ink); margin-top:14px; }

  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0; }
  #content table { border-collapse:collapse; font-size:14px; width:100%; min-width:min(100%,520px); }
  #content th, #content td { text-align:left; padding:9px 12px; border:1px solid var(--line); vertical-align:top; }
  #content th { background:#f3eee2; font-weight:700; white-space:nowrap; }
  .mermaid { margin:22px 0; text-align:center; overflow-x:auto; }

  .back { display:inline-block; margin-top:30px; font-family:"Kyobo","Caveat",cursive; font-size:20px; color:var(--blue); text-decoration:none; }
  .back:hover { color:var(--red); }
  footer { margin-top:40px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; font-family:"Kyobo","Caveat",cursive; font-size:18px; color:var(--pencil); }
  footer b { color:var(--red); }
  .loading { color:var(--pencil); opacity:.6; padding:40px 0; }

  @media (max-width:560px) {
    .page { padding:28px 14px 70px; }
    .doc { padding:26px 18px; border-radius:12px; }
    .brief { padding:6px 15px 14px; }
  }
</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/">home</a>
      <a href="/business/">business</a>
      <a href="/blog/" data-active>blog</a>
      <a href="mailto:pepper@peppinch.com">contact</a>
    </nav>

    <div class="doc">
      <span class="meta-date" id="meta-date"></span>
      <p class="source" id="meta-source"></p>
      <article id="content"><p class="loading">불러오는 중…</p></article>
    </div>

    <a class="back" href="/blog/">← 다른 메모 보기</a>
    <footer>
      <span>made slow, in seoul — <b>peppinch</b> 🧂</span>
      <span>pepper@peppinch.com · @peppinch_</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('p');
      var content = document.getElementById('content');
      if (!slug || !/^[\w-]+$/.test(slug)) { content.innerHTML = '<p>글을 찾을 수 없어요.</p>'; return; }
      fetch('posts/' + slug + '.md')
        .then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (raw) {
          var meta = {}, body = raw;
          var fm = raw.match(/^---\n([\s\S]*?)\n---\n?/);
          if (fm) {
            fm[1].split('\n').forEach(function (line) { var i = line.indexOf(':'); if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim(); });
            body = raw.slice(fm[0].length);
          }
          if (meta.title) document.title = meta.title + ' · peppinch blog';
          if (meta.date) document.getElementById('meta-date').textContent = meta.date.replace(/-/g, ' · ');
          if (meta.source) { var s = '출처: ' + meta.source; if (meta.source_url) s += ' · <a href="' + meta.source_url + '">원본</a>'; document.getElementById('meta-source').innerHTML = s; }
          content.innerHTML = marked.parse(body, { gfm: true, breaks: false });
          content.querySelectorAll('code.language-mermaid').forEach(function (code) { var d = document.createElement('div'); d.className = 'mermaid'; d.textContent = code.textContent; (code.closest('pre') || code).replaceWith(d); });
          content.querySelectorAll('table').forEach(function (t) { var w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
          if (window.mermaid) { mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' }); try { mermaid.run({ nodes: content.querySelectorAll('.mermaid') }); } catch (e) {} }
        })
        .catch(function () { content.innerHTML = '<p>글을 불러오지 못했어요. 주소를 확인해 주세요.</p>'; });
    })();
  </script>
</body>
</html>
