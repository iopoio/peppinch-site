<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>peppinch — blog</title>
<meta name="description" content="펩핀치 블로그 글." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧂</text></svg>" />

<!-- og: JS가 글 로드 후 갱신 -->
<meta property="og:type" content="article" />
<meta property="og:image" content="https://www.peppinch.com/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZ7ZXMFEBM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date()); gtag('config', 'G-LZ7ZXMFEBM');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />

<style>
  @font-face {
    font-family: "Kyobo";
    src: url("/fonts/KyoboHandwriting2019.woff2") format("woff2"),
         url("/fonts/KyoboHandwriting2019.otf") format("opentype");
    font-display: swap;
  }
  :root { --paper:#faf6ec; --ink:#2a2823; --pencil:#3a352c; --red:#c8412c; --blue:#2f5fa8; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; max-width:100%; overflow-x:clip; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:"Kalam","Kyobo",sans-serif; font-weight:300;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(91deg, transparent 0 38px, rgba(0,0,0,.012) 38px 39px),
      repeating-linear-gradient(2deg, transparent 0 46px, rgba(0,0,0,.012) 46px 47px);
    pointer-events:none; mix-blend-mode:multiply; z-index:1;
  }
  .page { position:relative; max-width:760px; margin:0 auto; padding:64px 32px 120px; z-index:3; }

  .nav { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:48px; }
  .nav a {
    font-family:"Kyobo","Caveat",cursive; font-weight:500; font-size:22px;
    color:var(--pencil); text-decoration:none; line-height:1;
    padding:6px 14px 4px; border:1.5px dashed transparent; transition:.25s;
  }
  .nav a:hover { color:var(--red); border-color:var(--red); }
  .nav a[data-active] { color:var(--red); border-color:var(--red); border-style:solid; border-width:2px; }

  /* ── 본문 (markdown 렌더 영역) ── */
  .content { font-size:17px; line-height:1.75; min-width:0; }
  .content h1 { font-family:"Kyobo","Caveat",cursive; font-weight:700; font-size:clamp(32px,6vw,52px); line-height:1.08; margin:8px 0 14px; transform:rotate(-.5deg); }
  .content h2 { font-family:"Kyobo","Caveat",cursive; font-weight:700; font-size:28px; margin:42px 0 14px; }
  .content h3 { font-family:"Kyobo","Caveat",cursive; font-weight:700; font-size:22px; margin:28px 0 10px; }
  .content p { margin:14px 0; overflow-wrap:anywhere; }
  .content a { color:var(--blue); }
  .content strong, .content b { color:var(--ink); font-weight:700; }
  .content ul, .content ol { padding-left:22px; }
  .content li { margin:6px 0; }
  .content hr { border:0; border-top:2px dashed rgba(58,53,44,.22); margin:36px 0; }
  .content blockquote {
    margin:18px 0; padding:6px 0 6px 18px; border-left:3px solid var(--red);
    color:var(--pencil); font-size:15px;
  }
  .content code { font-family:ui-monospace,Menlo,monospace; font-size:.92em; background:rgba(58,53,44,.06); padding:1px 5px; border-radius:4px; }
  .content pre { background:rgba(58,53,44,.05); padding:14px; border-radius:8px; overflow-x:auto; }
  .content pre code { background:none; padding:0; }

  /* ── 표: 절대 안 깨짐 (모바일은 가로 스크롤) ── */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0; }
  .content table { border-collapse:collapse; font-size:15px; min-width:min(100%,520px); width:100%; }
  .content th, .content td { text-align:left; padding:10px 12px; border:1.5px dashed rgba(58,53,44,.3); vertical-align:top; }
  .content th { color:var(--red); font-weight:700; background:rgba(200,65,44,.05); white-space:nowrap; }

  /* ── 순서도 (mermaid) ── */
  .mermaid { margin:22px 0; text-align:center; overflow-x:auto; }

  .meta-date { font-family:"Kyobo","Kalam",sans-serif; font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--red); font-weight:700; }
  .source { font-size:15px; color:var(--pencil); opacity:.8; margin:2px 0 30px; }
  .source a { color:var(--blue); }

  .back { display:inline-block; margin-top:36px; font-family:"Kyobo","Caveat",cursive; font-size:20px; color:var(--blue); text-decoration:none; }
  .back:hover { color:var(--red); }
  footer {
    margin-top:56px; padding-top:24px; border-top:2px dashed rgba(58,53,44,.2);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px;
    font-family:"Kyobo","Caveat",cursive; font-size:18px; color:var(--pencil);
  }
  footer b { color:var(--red); }
  .loading { color:var(--pencil); opacity:.6; font-style:italic; padding:40px 0; }
</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/">home</a>
      <a href="/business/">business</a>
      <a href="/blog/" data-active>blog</a>
      <a href="mailto:pepper@peppinch.com">contact</a>
    </nav>

    <span class="meta-date" id="meta-date"></span>
    <p class="source" id="meta-source"></p>
    <article class="content" id="content"><p class="loading">불러오는 중…</p></article>

    <a class="back" href="/blog/">← 다른 메모 보기</a>
    <footer>
      <span>made slow, in seoul — <b>peppinch</b> 🧂</span>
      <span>pepper@peppinch.com · @peppinch_</span>
    </footer>
  </div>

  <!-- 변환기: marked(.md→html) + mermaid(순서도) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('p');
      var content = document.getElementById('content');
      if (!slug || !/^[\w-]+$/.test(slug)) { content.innerHTML = '<p>글을 찾을 수 없어요.</p>'; return; }

      fetch('posts/' + slug + '.md')
        .then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (raw) {
          // ── frontmatter 분리 ──
          var meta = {}, body = raw;
          var fm = raw.match(/^---\n([\s\S]*?)\n---\n?/);
          if (fm) {
            fm[1].split('\n').forEach(function (line) {
              var i = line.indexOf(':');
              if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
            });
            body = raw.slice(fm[0].length);
          }
          // body 안 첫 h1은 제목으로 쓰니 중복 제거(frontmatter title 있으면)
          if (meta.title) {
            document.title = meta.title + ' · peppinch blog';
            document.getElementById('meta-date').textContent =
              (meta.date || '').replace(/-/g, ' · ');
            if (meta.source) {
              var s = '출처: ' + meta.source;
              if (meta.source_url) s += ' · <a href="' + meta.source_url + '">원본</a>';
              document.getElementById('meta-source').innerHTML = s;
            }
          }

          // ── markdown → html (GFM 표 ON, 원시 HTML 통과) ──
          content.innerHTML = marked.parse(body, { gfm: true, breaks: false });

          // ── mermaid 코드블록 → 다이어그램 ──
          content.querySelectorAll('code.language-mermaid').forEach(function (code) {
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = code.textContent;
            var pre = code.closest('pre');
            (pre || code).replaceWith(div);
          });

          // ── 표 감싸기 (모바일 가로 스크롤 = 안 깨짐) ──
          content.querySelectorAll('table').forEach(function (t) {
            var w = document.createElement('div');
            w.className = 'table-wrap';
            t.replaceWith(w); w.appendChild(t);
          });

          // ── 순서도 렌더 ──
          if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
            try { mermaid.run({ nodes: content.querySelectorAll('.mermaid') }); } catch (e) {}
          }
        })
        .catch(function () { content.innerHTML = '<p>글을 불러오지 못했어요. 주소를 확인해 주세요.</p>'; });
    })();
  </script>
</body>
</html>
