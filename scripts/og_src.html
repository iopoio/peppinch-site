<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Kyobo";src:url("fonts/KyoboHandwriting2019.woff2") format("woff2")}
body{margin:0;width:1200px;height:630px;background:#F6F4ED;color:#33312B;position:relative;overflow:hidden;
font-family:'Gowun Dodum',sans-serif;
background-image:repeating-linear-gradient(transparent,transparent 51px,rgba(51,49,43,0.07) 51px,rgba(51,49,43,0.07) 52px);
background-position:0 34px}
.wrap{padding:70px 96px;display:flex;flex-direction:column;height:100%;box-sizing:border-box;position:relative}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:44px;height:44px}
.bn{font-family:'Shantell Sans',cursive;font-weight:700;font-size:40px}
.bt{font-family:'Kyobo';font-size:24px;color:#8F8B7D;padding-top:8px}
.hero{margin-top:44px}
.h1{font-family:'Shantell Sans',cursive;font-weight:700;font-size:88px;line-height:1.05;letter-spacing:-0.02em}
.row{display:flex;align-items:flex-end;gap:26px}
.pepper{font-family:'Shantell Sans',cursive;font-style:italic;font-weight:800;font-size:100px;line-height:1.16;color:#3E7C5B;
text-decoration:underline wavy rgba(62,124,91,0.4) 3px;text-underline-offset:14px}
.note{font-family:'Kyobo';font-size:23px;line-height:1.55;color:#3E7C5B;padding-bottom:22px;transform:rotate(-2deg)}
.sub{margin-top:auto;font-family:'Kyobo';font-size:27px;color:#615D51}
.sub b{color:#3E7C5B;font-weight:400}
.dots{position:absolute;right:88px;bottom:64px;transform:rotate(10deg)}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 40 40"><ellipse cx="24" cy="8" rx="3.7" ry="3.3" fill="#33312B" transform="rotate(-15 24 8)"/><ellipse cx="9" cy="14" rx="4.8" ry="4.3" fill="#33312B" transform="rotate(-10 9 14)"/><ellipse cx="25" cy="27" rx="6.3" ry="5.6" fill="#33312B" transform="rotate(8 25 27)"/></svg>
    <span class="bn">Peppinch</span><span class="bt">한 꼬집의 후추</span>
  </div>
  <div class="hero">
    <div class="h1">A Pinch of</div>
    <div class="row">
      <span class="pepper">Pepper.</span>
      <span class="note">↖ 뭐든, 한 꼬집이면<br>맛이 달라져요.</span>
    </div>
  </div>
  <div class="sub">이런 거 왜 없지 싶은 걸 <b>한 꼬집씩 만들고</b>, 관심있는 것들을 <b>한 꼬집씩 적어봅니다</b>.</div>
  <div class="dots"><svg width="86" height="86" viewBox="0 0 40 40"><ellipse cx="24" cy="8" rx="3.7" ry="3.3" fill="#33312B" transform="rotate(-15 24 8)"/><ellipse cx="9" cy="14" rx="4.8" ry="4.3" fill="#33312B" transform="rotate(-10 9 14)"/><ellipse cx="25" cy="27" rx="6.3" ry="5.6" fill="#3E7C5B" transform="rotate(8 25 27)"/></svg></div>
</div>
</body></html>
